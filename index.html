<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title></title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#1C1F26;
}

canvas{
    display:block;
}

#info{
    position:fixed;
    top:16px;
    left:16px;
    color:white;
    background:rgba(0,0,0,.5);
    padding:10px 14px;
    border-radius:8px;
    font-size:14px;
    pointer-events:none;
}

#vrBtn{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 28px;
    border:none;
    border-radius:8px;
    background:#F5A623;
    color:#1C1F26;
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>
<body>

<div id="info">
Klik objek untuk melihat informasi
</div>

<button id="vrBtn">
Masuk VR
</button>

<canvas id="c"></canvas>

<script type="module" src="app.js"></script>

</body>
</html>
